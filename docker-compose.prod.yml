version: "3.8"

services:
  app:
    image: thaetamii/thenorth:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: next-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
