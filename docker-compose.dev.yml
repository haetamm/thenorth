version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: next-dev
    image: thaetamii/thenorth:dev
    ports:
      - "3000:3000"
    env_file:
      - .env

    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    restart: unless-stopped
